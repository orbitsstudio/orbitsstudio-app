<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#080c14"/>
  <defs>
    <linearGradient id="nexusGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="orbitRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Orbital Rings -->
  <ellipse cx="256" cy="256" rx="190" ry="85" transform="rotate(-30 256 256)" stroke="url(#orbitRing)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
  <ellipse cx="256" cy="256" rx="190" ry="85" transform="rotate(35 256 256)" stroke="url(#orbitRing)" stroke-width="4" stroke-dasharray="12 8" opacity="0.75"/>
  <circle cx="256" cy="256" r="140" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Core Connected Nodes -->
  <!-- Outer Orbit Nodes -->
  <circle cx="120" cy="180" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <line x1="120" y1="180" x2="256" y2="256" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4"/>

  <circle cx="390" cy="190" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <line x1="390" y1="190" x2="256" y2="256" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4"/>

  <circle cx="160" cy="370" r="9" fill="#38bdf8" filter="url(#glow)"/>
  <line x1="160" y1="370" x2="256" y2="256" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>

  <circle cx="360" cy="350" r="11" fill="#00f2fe" filter="url(#glow)"/>
  <line x1="360" y1="350" x2="256" y2="256" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Center Orbital Core -->
  <circle cx="256" cy="256" r="64" fill="url(#nexusGlow)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="48" fill="#080c14"/>
  
  <!-- Stylized Nexus N Node -->
  <path d="M236 220 V292 M236 220 L276 292 M276 220 V292" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff" filter="url(#glow)"/>
</svg>
